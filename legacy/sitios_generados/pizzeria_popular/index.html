<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria Popular — Experiencia Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #030712; color: #f9fafb; }
        .glass { background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body x-data="{ categoria: 'todos', modalOpen: false, productoSel: '' }" class="antialiased">
    <nav class="max-w-7xl mx-auto p-6 flex justify-between items-center relative z-10">
        <span class="font-black text-amber-400 tracking-widest uppercase text-sm">Pizzeria Popular</span>
        <a href="https://wa.me/?text=Hola!%20Consulta%20para%20Pizzeria%20Popular" class="text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 px-5 py-2.5 rounded-full transition-all">Pedir por WhatsApp</a>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12 text-center relative z-10">
        <span class="inline-block px-4 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-amber-400 text-xs font-bold mb-6">Carta & Pedidos Online</span>
        <h1 class="text-5xl md:text-7xl font-black mb-6 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Pizzeria Popular</h1>
        <p class="text-slate-400 max-w-xl mx-auto mb-10">Especialidades artesanales, ingredientes seleccionados y envíos rápidos directos a tu puerta.</p>

        <div class="flex justify-center gap-3 mb-12">
            <button @click="categoria = 'todos'" :class="categoria === 'todos' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-400'" class="px-5 py-2 rounded-full text-xs font-bold transition-all">Todos</button>
            <button @click="categoria = 'especiales'" :class="categoria === 'especiales' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-400'" class="px-5 py-2 rounded-full text-xs font-bold transition-all">Especiales</button>
            <button @click="categoria = 'combos'" :class="categoria === 'combos' ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-400'" class="px-5 py-2 rounded-full text-xs font-bold transition-all">Promos</button>
        </div>

        <div class="grid md:grid-cols-3 gap-6 text-left">
            <template x-if="categoria === 'todos' || categoria === 'especiales'">
                <div class="glass p-6 rounded-3xl hover:border-amber-500/50 transition-all">
                    <span class="text-[10px] font-extrabold text-amber-400 uppercase bg-amber-950/50 px-2.5 py-1 rounded-full border border-amber-800/50">Top Ventas</span>
                    <h3 class="text-lg font-bold text-white mt-4 mb-2">Especial de la Casa</h3>
                    <p class="text-xs text-slate-400 mb-6">Masa madre, salsa artesanal, mozzarella premium y orégano fresco.</p>
                    <button @click="modalOpen = true; productoSel = 'Especial de la Casa'" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-white transition-all flex items-center justify-center gap-2">
                        <span>Ver Detalle / Ordenar</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </template>
        </div>
    </main>

    <div x-show="modalOpen" x-transition class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl max-w-md w-full relative text-left">
            <h3 class="text-xl font-black text-white mb-2" x-text="productoSel"></h3>
            <p class="text-xs text-slate-400 mb-6">Confirmá tu pedido directo por WhatsApp para coordinar envío o retiro.</p>
            <a :href="'https://wa.me/?text=Hola!%20Quiero%20pedir:%20' + encodeURIComponent(productoSel)" class="block text-center w-full py-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs transition-all">Confirmar Pedido por WhatsApp</a>
            <button @click="modalOpen = false" class="mt-4 w-full text-center text-xs text-slate-500 hover:text-white">Cerrar</button>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
